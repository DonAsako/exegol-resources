// Firefox autoconfig (first line must be a comment). Default prefs that can't be set through policies.json.
// Copied to /usr/lib/firefox-esr/exegol.cfg; defaultPref() keeps them editable in about:config.

// No sandbox warning bar: user namespaces are unavailable in the container
defaultPref("security.sandbox.warn_unprivileged_namespaces", false);

// DevTools: keep network/console logs across navigations, bypass cache while open
defaultPref("devtools.netmonitor.persistlog", true);
defaultPref("devtools.webconsole.persistlog", true);
defaultPref("devtools.cache.disabled", true);
defaultPref("view_source.wrap_long_lines", true);
// View source: wrap long lines (minified JS)
defaultPref("view_source.wrap_long_lines", true);
